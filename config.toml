[camera]
# ... keep your working camera settings ...
[camera.controls]
exposure_dynamic_framerate = 0
auto_exposure = 1
exposure_time_absolute = 400
brightness = 170
gamma = 135
backlight_compensation = 0

[loop]
fps_active = 30
fps_idle = 6
idle_after_s = 2.0
lost_grace_s = 0.25
hold_grace_s = 0.15
two_grace_s = 0.3
label_votes = 3
cooldown_s = 0.3
stats_every_s = 10.0
notifications = true
notify_pose = true
pose_notify_after_s = 0.12
pose_notify_cooldown_s = 0.8
hud = true
hud_min_interval_s = 0.12

[detector]
model_complexity =1 
min_detection_confidence = 0.45
min_tracking_confidence = 0.4
swap_handedness = false

[pose]
pinch_on = 0.35
pinch_off = 0.55
finger_extend = 0.95
thumb_extend = 0.75
fist_curl_max = 0.27
palm_min_spread = 0.92
palm_min_fingers = 3
thumbs_up_min = 0.45
fists_require_open_first = true

[swipe]
arm_s = 0.05
still_max = 0.06
rearm_still_max = 0.04
palm_grace_s = 0.2
min_distance = 0.09
wave_distance = 0.08
window_s = 0.5
axis_ratio = 1.5
rearm_s = 0.25
scrub = true
scrub_delay_s = 0.4
scrub_interval_s = 0.3
scrub_pause_s = 0.2
scrub_eps = 0.004
scrub_reverse = 0.06

[three_finger_swipe]
arm_s = 0.05
still_max = 0.06
rearm_still_max = 0.04
min_distance = 0.08
wave_distance = 0.06
window_s = 0.5
axis_ratio = 1.5
rearm_s = 0.25

[pinch_drag]
settle_s = 0.06
min_distance = 0.10
wave_distance = 0.08
axis_ratio = 1.5
scrub = true

[resize]
step_norm = 0.04
min_interval_s = 0.12

[workspaces]
count = 10
wrap = true

[pointer]
enabled = true
sensitivity = 2.5        # was 1.6 — 3× more responsive
deadzone = 0.0025        # was 0.006 — allow smaller motions to register
ema_alpha = 0.55         # was 0.45 — slightly less smoothing, less lag
accel = 0.5              # was 0.35 — bigger multiplier for large motions# --- BINDINGS ---
velocity_floor = 0.018 

[[binding]]
name = "toggle cursor mode (pinky)"
gesture = "pinky_hold"
hand = "any"
hold_s = 0.25
command = "true"

# Three-finger swipe = Switch Workspace (since peace is gone)
[[binding]]
name = "three-finger left -> next workspace"
gesture = "three_finger_swipe_left"
hand = "any"
command = "workspace number {next}"

[[binding]]
name = "three-finger right -> previous workspace"
gesture = "three_finger_swipe_right"
hand = "any"
command = "workspace number {prev}"

[[binding]]
name = "pinch left -> send window to previous workspace (stay)"
gesture = "pinch_drag_left"
hand = "any"
command = "move container to workspace number {prev}"

[[binding]]
name = "pinch right -> send window to next workspace (stay)"
gesture = "pinch_drag_right"
hand = "any"
command = "move container to workspace number {next}"

# Thumbs up = confirm
[[binding]]
name = "confirm dialog (thumbs up)"
gesture = "thumbs_up_hold"
hand = "any"
hold_s = 0.25
command = "exec wtype -k Return"

[[binding]]
name = "close window (single fist hold)"
gesture = "fists_hold"
hand = "any"
hold_s = 5
notify = "Closing window - open your hand to cancel"
command = "kill"

# Two-hand resize
[[binding]]
name = "resize wider"
gesture = "resize_spread_h"
hand = "both"
command = "resize grow width 10px"

[[binding]]
name = "resize narrower"
gesture = "resize_squeeze_h"
hand = "both"
command = "resize shrink width 10px"

[[binding]]
name = "resize taller"
gesture = "resize_spread_v"
hand = "both"
command = "resize grow height 10px"

[[binding]]
name = "resize shorter"
gesture = "resize_squeeze_v"
hand = "both"
command = "resize shrink height 10px"
